<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>臺南市永康區永康國民小學 - 教職員午餐登記系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen pb-12">

  <header class="bg-emerald-700 text-white shadow-md mb-8">
    <div class="max-w-6xl mx-auto px-4 py-6 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-4">
        <div class="bg-white text-emerald-700 p-3 rounded-full text-2xl">
          <i class="fa-solid fa-utensils"></i>
        </div>
        <div>
          <h1 class="text-2xl font-bold tracking-wide">臺南市永康區永康國民小學</h1>
          <p class="text-emerald-100 text-sm">教職員午餐登記系統</p>
        </div>
      </div>
      <button onclick="toggleSettingsModal()" class="bg-emerald-800 hover:bg-emerald-900 text-emerald-100 px-4 py-2 rounded-lg text-sm flex items-center gap-2 transition">
        <i class="fa-solid fa-gear"></i> 串接設定
      </button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4">
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center">
        <div>
          <p class="text-slate-500 text-sm font-medium mb-1">已登記總人數</p>
          <p class="text-3xl font-bold text-slate-800" id="stat-total">0 <span class="text-base font-normal text-slate-500">人</span></p>
        </div>
        <div class="w-12 h-12 bg-slate-100 rounded-xl flex items-center justify-center text-slate-600 text-xl">
          <i class="fa-solid fa-users"></i>
        </div>
      </div>

      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center">
        <div>
          <p class="text-amber-600 text-sm font-medium mb-1">葷食登記數</p>
          <p class="text-3xl font-bold text-amber-600" id="stat-meat">0 <span class="text-base font-normal text-slate-500">份</span></p>
        </div>
        <div class="w-12 h-12 bg-amber-50 rounded-xl flex items-center justify-center text-amber-600 text-xl">
          <i class="fa-solid fa-drumstick-bite"></i>
        </div>
      </div>

      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center">
        <div>
          <p class="text-emerald-600 text-sm font-medium mb-1">素食登記數</p>
          <p class="text-3xl font-bold text-emerald-600" id="stat-veg">0 <span class="text-base font-normal text-slate-500">份</span></p>
        </div>
        <div class="w-12 h-12 bg-emerald-50 rounded-xl flex items-center justify-center text-emerald-600 text-xl">
          <i class="fa-solid fa-leaf"></i>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      
      <div class="lg:col-span-7 bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-100">
        <h2 class="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">
          <i class="fa-solid fa-pen-to-square text-emerald-600"></i> 填寫登記表單
        </h2>

        <form id="lunch-form" onsubmit="handleFormSubmit(event)" class="space-y-6">
          
          <div>
            <label class="block text-slate-700 font-medium mb-2"><i class="fa-regular fa-calendar"></i> 登記日期 *</label>
            <input type="date" id="form-date" required class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-slate-700 font-medium mb-2"><i class="fa-regular fa-user"></i> 教職員姓名 *</label>
              <input type="text" id="form-name" placeholder="請輸入姓名" required class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-slate-700 font-medium mb-2"><i class="fa-solid fa-location-dot"></i> 用餐地點 *</label>
              <input type="text" id="form-location" placeholder="例如：301教室、教務處" required class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>
          </div>

          <div>
            <label class="block text-slate-700 font-medium mb-2"><i class="fa-solid fa-bowl-food"></i> 飲食種類 *</label>
            <div class="grid grid-cols-2 gap-4">
              <label class="cursor-pointer border-2 border-slate-200 p-4 rounded-xl flex flex-col items-center gap-2 transition hover:border-emerald-500 has-[:checked]:border-emerald-600 has-[:checked]:bg-emerald-50/30">
                <input type="radio" name="diet" value="葷食" checked class="hidden">
                <i class="fa-solid fa-drumstick-bite text-2xl text-amber-600"></i>
                <span class="font-bold text-slate-700">葷食</span>
              </label>
              <label class="cursor-pointer border-2 border-slate-200 p-4 rounded-xl flex flex-col items-center gap-2 transition hover:border-emerald-500 has-[:checked]:border-emerald-600 has-[:checked]:bg-emerald-50/30">
                <input type="radio" name="diet" value="素食" class="hidden">
                <i class="fa-solid fa-leaf text-2xl text-emerald-600"></i>
                <span class="font-bold text-slate-700">素食</span>
              </label>
            </div>
          </div>

          <div>
            <label class="block text-slate-700 font-medium mb-2"><i class="fa-regular fa-comment"></i> 特殊需求 / 備註</label>
            <input type="text" id="form-note" placeholder="可不填" class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          </div>

          <button type="submit" id="submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl shadow-sm transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-paper-plane"></i> 送出登記
          </button>

        </form>
      </div>

      <div class="lg:col-span-5 bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-100 flex flex-col">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-list-check text-emerald-600"></i> 最新登記動態
          </h2>
          <div class="flex items-center gap-2">
            <button onclick="fetchData()" class="text-slate-400 hover:text-emerald-600 p-2 rounded-lg transition" title="重新整理">
              <i class="fa-solid fa-rotate"></i>
            </button>
            <button onclick="exportCSV()" class="bg-emerald-50 text-emerald-700 hover:bg-emerald-100 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1">
              <i class="fa-solid fa-file-csv"></i> 匯出 CSV
            </button>
          </div>
        </div>

        <div id="records-list" class="space-y-3 flex-1 overflow-y-auto max-h-[500px]">
          </div>
      </div>

    </div>
  </main>

  <div id="settings-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-xl">
      <h3 class="text-lg font-bold mb-4 text-slate-800">⚙️ Web App URL 串接設定</h3>
      <input type="text" id="gas-url-input" class="w-full p-3 border rounded-xl mb-4 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
      <div class="flex justify-end gap-2">
        <button onclick="toggleSettingsModal()" class="px-4 py-2 text-slate-500 hover:bg-slate-100 rounded-lg">取消</button>
        <button onclick="saveSettings()" class="px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700">儲存</button>
      </div>
    </div>
  </div>

  <script>
    // 預設將 GAS 部署網址寫死在代碼中，解決跨瀏覽器無設定問題
    const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbwcvIHMTBXsB88UIRgEjuf1eoJQCUkG5DnLp4lB1EL4KtuREbAunqtHkYAAeX0hncxQ/exec';
    
    let gasUrl = localStorage.getItem('ykes_lunch_records_url') || DEFAULT_GAS_URL;
    let recordsData = [];

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('form-date').valueAsDate = new Date();
      document.getElementById('gas-url-input').value = gasUrl;
      fetchData();
    });

    function toggleSettingsModal() {
      const modal = document.getElementById('settings-modal');
      modal.classList.toggle('hidden');
      modal.classList.toggle('flex');
    }

    function saveSettings() {
      gasUrl = document.getElementById('gas-url-input').value.trim();
      localStorage.setItem('ykes_lunch_records_url', gasUrl);
      toggleSettingsModal();
      fetchData();
    }

    async function fetchData() {
      const listEl = document.getElementById('records-list');
      listEl.innerHTML = `<div class="text-center py-8 text-slate-400"><i class="fa-solid fa-spinner fa-spin text-2xl"></i><p class="mt-2 text-sm">載入資料中...</p></div>`;

      if (!gasUrl) {
        listEl.innerHTML = `<div class="text-center py-8 text-slate-400"><p class="text-sm">尚未設定 GAS 串接網址</p></div>`;
        return;
      }

      try {
        const res = await fetch(gasUrl);
        const data = await res.json();
        recordsData = data || [];
        renderUI();
      } catch (err) {
        console.error(err);
        listEl.innerHTML = `<div class="text-center py-8 text-rose-500"><i class="fa-solid fa-circle-exclamation text-2xl"></i><p class="mt-2 text-sm">讀取失敗，請確認網路或 GAS 設定</p></div>`;
      }
    }

    function renderUI() {
      const listEl = document.getElementById('records-list');
      
      // 計算統計數字並即時同步頂部卡片
      let meat = 0, veg = 0;
      recordsData.forEach(item => {
        if (item.diet === '素食') veg++;
        else meat++;
      });

      document.getElementById('stat-total').innerText = recordsData.length;
      document.getElementById('stat-meat').innerText = meat;
      document.getElementById('stat-veg').innerText = veg;

      if (recordsData.length === 0) {
        listEl.innerHTML = `
          <div class="text-center py-12 text-slate-400">
            <i class="fa-regular fa-folder-open text-4xl mb-2"></i>
            <p class="text-sm">今天尚無登記紀錄</p>
          </div>`;
        return;
      }

      listEl.innerHTML = recordsData.map(item => `
        <div class="p-4 rounded-xl border border-slate-100 bg-slate-50 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm ${item.diet === '素食' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
              ${item.diet === '素食' ? '素' : '葷'}
            </div>
            <div>
              <div class="flex items-center gap-2">
                <span class="font-bold text-slate-800">${item.name}</span>
                <span class="text-xs bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full"><i class="fa-solid fa-location-dot"></i> ${item.location}</span>
              </div>
              <p class="text-xs text-slate-400 mt-1">${item.note ? '💬 ' + item.note : ''}</p>
            </div>
          </div>
          <span class="text-xs text-slate-400">${item.timestamp || ''}</span>
        </div>
      `).join('');
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 送出中...`;

      const formData = {
        date: document.getElementById('form-date').value,
        name: document.getElementById('form-name').value.trim(),
        location: document.getElementById('form-location').value.trim(),
        diet: document.querySelector('input[name="diet"]:checked').value,
        note: document.getElementById('form-note').value.trim()
      };

      try {
        await fetch(gasUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });

        // 重置表單並重新抓取雲端資料
        document.getElementById('form-name').value = '';
        document.getElementById('form-location').value = '';
        document.getElementById('form-note').value = '';

        setTimeout(() => {
          fetchData();
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> 送出登記`;
        }, 1200);

      } catch (err) {
        alert('提交失敗：' + err.message);
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> 送出登記`;
      }
    }

    function exportCSV() {
      if (recordsData.length === 0) return alert('目前沒有資料可匯出');
      let csv = '\uFEFF時間,日期,姓名,地點,飲食,備註\n';
      recordsData.forEach(r => {
        csv += `"${r.timestamp || ''}","${r.date || ''}","${r.name || ''}","${r.location || ''}","${r.diet || ''}","${r.note || ''}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `午餐登記_${new Date().toISOString().slice(0,10)}.csv`;
      link.click();
    }
  </script>
</body>
</html>
